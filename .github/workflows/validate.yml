name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Agent Skills
        run: python scripts/validate_skills.py
      - name: Run skill self-tests
        shell: bash
        run: |
          for test in skills/*/scripts/test_*.py; do
            [ -e "$test" ] || continue
            python "$test"
          done
